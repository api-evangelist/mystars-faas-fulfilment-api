note: >-
  Not RFC 9457 - every error is application/json with a stable envelope
  { "error": { "code", "message", "telegram_message?" } }. code is the machine string to branch on;
  telegram_message, when present, is a verbatim user-facing message from Fragment. A malformed JSON
  body returns 400 bad_request; a body over 256 KB is rejected. Error codes are a closed enum in
  components.schemas.Error.
