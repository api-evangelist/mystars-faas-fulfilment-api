name: MyStars FaaS — Fulfilment API
description: A B2B Fragment-as-a-Service (FaaS) fulfilment REST API for programmatically buying and reselling Telegram
  Stars and Telegram Premium, delivered to any Telegram @username, paid on-chain in TON (GRAM) or USDT (TON). Non-custodial,
  no KYC. Offers versioned /v1 endpoints for pricing, recipient checks, product catalog, and order lifecycle, with
  signed webhooks and official TypeScript and Python SDKs.
